CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_RING_BUFFER=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_OUTPUT=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_BACKEND_UART=n
CONFIG_KERNEL_LOG_LEVEL_WRN=y

# CDC ACM
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# USB Descriptor
CONFIG_USBD_PID=0x0001
CONFIG_USBD_PRODUCT="USBD Dog Feeder ACM"

# MOTORS
CONFIG_PWM=y
CONFIG_STEPPER=y
CONFIG_STEPPER_ADI_TMC2209=y

# RTC
CONFIG_I2C=y
CONFIG_RTC=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_DS3231=y

# Sleep Mode
CONFIG_POWEROFF=y
CONFIG_PM=y
CONFIG_SOC_LOG_LEVEL_ERR=y
CONFIG_PM_LOG_LEVEL_INF=y